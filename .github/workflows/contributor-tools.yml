name: Contributor workflow checks

on:
  pull_request:
    paths: ["tools/**", ".github/workflows/contributor-tools.yml"]
  push:
    paths: ["tools/**", ".github/workflows/contributor-tools.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p "test_*.py" -v
