# fail2ban filter: beacon-api-flood
# Caddy JSON access log, one object per line. Every request to /api/ from an IP counts as one hit;
# the jail's maxretry/findtime decide what "too many" is.
[Definition]
datepattern = "ts":{EPOCH}
failregex   = ^\{"level":"\w+",.*?"request":\{"remote_ip":"<HOST>","remote_port":"\d+",.*?"uri":"/api/
ignoreregex =
