# fail2ban filter: beacon-api-429
# Requests to /api/ that beacon-server already throttled (status 429). A client that keeps hammering
# through 429s is ignoring the app's own limit; this jail only enforces persistence.
[Definition]
datepattern = "ts":{EPOCH}
failregex   = ^\{"level":"\w+",.*?"request":\{"remote_ip":"<HOST>","remote_port":"\d+",.*?"uri":"/api/.*?"status":429,
ignoreregex =
