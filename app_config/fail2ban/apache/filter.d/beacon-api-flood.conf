# fail2ban filter: beacon-api-flood
# Apache `combined` log (Ubuntu variant). Every request to /api/ from an IP counts as one hit;
# the jail's maxretry/findtime decide what "too many" is. fail2ban has already cut the date out.
[Definition]
failregex = ^<HOST> \S+ \S+ \[?\]? ?"[A-Z]+ /api/
ignoreregex =
