# Beacon behind a host Apache (the analyzer.meshmapper.net shape). Drop these lines into the
# *:443 VirtualHost next to the existing ProxyPass rules. Needs mod_headers, mod_proxy,
# mod_proxy_http, mod_proxy_wstunnel, mod_authz_core (all already loaded on that box).

    # dedicated log so fail2ban and the runbook can parse it (other_vhosts uses vhost_combined)
    ErrorLog  ${APACHE_LOG_DIR}/analyzer-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/analyzer-ssl-access.log combined

    # client-IP hygiene: the app trusts these headers, so only Apache may set them.
    # mod_proxy re-adds a clean X-Forwarded-For after the unset.
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP       early
    RequestHeader unset True-Client-IP  early
    RequestHeader set   X-Real-IP "%{REMOTE_ADDR}s"

    # scraper User-Agent signatures live in /etc/apache2/beacon-blocklist-ua.conf; a match sets
    # beacon_block, which the /api and /ws blocks below reject
    Include /etc/apache2/beacon-blocklist-ua.conf

    # manual block list for /api and /ws: edit /etc/apache2/beacon-blocklist.conf, then
    # `apachectl configtest && systemctl reload apache2`
    <Location "/api">
        <RequireAll>
            Require all granted
            Require not env beacon_block
            Include /etc/apache2/beacon-blocklist.conf
        </RequireAll>
    </Location>
    <Location "/ws">
        <RequireAll>
            Require all granted
            Require not env beacon_block
            Include /etc/apache2/beacon-blocklist.conf
        </RequireAll>
    </Location>

# /etc/apache2/beacon-blocklist.conf — one `Require not ip <ip-or-cidr>` per line.
# Keep the TEST-NET placeholder so the file is never empty:
#
#   Require not ip 192.0.2.0/24
#
# /etc/apache2/beacon-blocklist-ua.conf — one SetEnvIfNoCase per scraper User-Agent signature:
#
#   SetEnvIfNoCase User-Agent "mesh\.hansimgamr\.net" beacon_block
